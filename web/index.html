<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/modmail-manager-tab-v2-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/modmail-manager-tab-v2-32.png" />
    <title>Modmail Manager Webpanel</title>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6245185799932586"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("modmail-manager-theme") ?? localStorage.getItem("eclipsebot-theme");
          const theme = storedTheme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
