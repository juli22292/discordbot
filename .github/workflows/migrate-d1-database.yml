name: Migrate D1 database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to copy archive_bot_panel into modmailbot_database
        required: true
        type: string
      traffic_stopped:
        description: Bot is stopped and the webpanel route is temporarily disabled
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-d1-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Export, import and verify D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
      MIGRATION_TRAFFIC_STOPPED: ${{ inputs.traffic_stopped }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a9fb35ab68395b2db486dd49c1b616e8
      OLD_DATABASE_ID: 4aa0fbf6-ae11-4153-adce-4687d922db4b
      NEW_DATABASE_ID: 8325e62c-57e2-4001-8c82-d5c799b1bac0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check confirmation and secret
        shell: bash
        run: |
          if [ "$MIGRATION_CONFIRMATION" != "MIGRATE" ]; then
            echo "Confirmation must be exactly MIGRATE."
            exit 1
          fi

          if [ "$MIGRATION_TRAFFIC_STOPPED" != "true" ]; then
            echo "Stop the bot and disable the webpanel route before starting."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "GitHub secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated migration configuration
        shell: bash
        run: |
          cat > wrangler.migration.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "discordbot-d1-migration",
            "compatibility_date": "2026-07-14",
            "d1_databases": [
              {
                "binding": "OLD_DB",
                "database_name": "archive_bot_panel",
                "database_id": "$OLD_DATABASE_ID"
              },
              {
                "binding": "NEW_DB",
                "database_name": "modmailbot_database",
                "database_id": "$NEW_DATABASE_ID"
              }
            ]
          }
          EOF

      - name: Confirm target database is empty
        run: node scripts/verify-d1-copy.mjs preflight

      - name: Export source database
        run: pnpm exec wrangler d1 export OLD_DB --remote --config wrangler.migration.jsonc --output d1-migration.sql

      - name: Import target database
        run: pnpm exec wrangler d1 execute NEW_DB --remote --config wrangler.migration.jsonc --file d1-migration.sql

      - name: Verify every table
        run: node scripts/verify-d1-copy.mjs verify

      - name: Write migration result
        shell: bash
        run: |
          {
            echo "## D1 migration successful"
            echo
            echo "The target database schema and all table row counts match the source database."
            echo
            echo "- Source: archive_bot_panel ($OLD_DATABASE_ID)"
            echo "- Target: modmailbot_database ($NEW_DATABASE_ID)"
            echo
            echo "The old database was not modified or deleted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SQL export
        if: always()
        shell: bash
        run: rm -f d1-migration.sql wrangler.migration.jsonc
